<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>JSON格式化工具</title>
    <style>
        /* ==================== 基础样式 ==================== */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            margin: 0;
            padding: 20px;
            height: 100%;

            max-height: calc(100vh - 5px);
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        /* ==================== 可拖动区域 ==================== */
        .drag-region {
            -webkit-app-region: drag !important;
        }

        .drag-region * {
            -webkit-app-region: drag !important;
        }

        .no-drag,
        .no-drag *:not(.drag-region):not(.drag-region *) {
            -webkit-app-region: no-drag;
        }

        /* ==================== KaTeX 样式 ==================== */
        .katex-display {
            margin: 0.5em 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .latex-inline {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-size: 16px;
            padding: 0 5px;
        }

        .latex-inline .katex {
            color: #11c7ce;
        }

        .latex-block {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-size: 18px;
            display: block;
            margin: 10px 0;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .latex-block .katex {
            color: #0d7377;
        }

        /* ==================== JSON 显示区域 ==================== */
        #json-display {
            margin-top: 10px;
            margin-bottom: 40px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #e6e6e6;
            padding: 15px;
            background-color: #fafafa;
            border-radius: 5px;
            flex: 1;
            min-height: 100px;
            max-height: calc(100vh - 450px);
            overflow-wrap: break-word;
            overflow: auto;
            overflow-x: auto;
            overflow-y: auto;
            color: #333;
            font-size: 14px;
            line-height: 1.6em;
        }

        /* JSON 元素样式 */
        .json-object,
        .json-array {
            margin-left: 1em;
            position: relative;
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-all;
        }

        .json-key {
            display: inline;
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-all;
            color: #881391;
            font-weight: 500;
        }

        .json-key::after {
            content: ': ';
        }

        .json-string {
            color: #0d7377;
            display: inline;
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .json-number {
            color: #1a73e8;
            display: inline;
        }

        .json-boolean {
            color: #e65100;
            display: inline;
        }

        .json-null {
            color: #757575;
            font-style: italic;
            display: inline;
        }
        }

        .json-boolean {
            color: #fe8019;
            display: inline;
        }

        .json-null {
            color: #b8bb26;
            display: inline;
        }

        /* 保留空白符样式 */
        .preserve-whitespace {
            white-space: pre-wrap !important;
        }

        .json-children {
            position: relative;
            margin-left: 1em;
            padding-left: 0.5em;
            border-left: 1px solid #555;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .json-children>li {
            position: relative;
        }

        .json-toggle {
            text-decoration: none;
            color: #ebdbb2;
            margin-left: -1em;
            margin-right: 0.5em;
            display: inline-block;
            width: 1em;
            cursor: pointer;
            font-weight: bold;
            vertical-align: middle;
        }

        .json-toggle+* {
            margin-left: 0.5em;
        }

        /* ==================== 编辑器容器 ==================== */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 编辑器容器内的 textarea */
        .editor-container textarea {
            flex: 1;
            resize: none;
            border: 1px solid #e6e6e6;
            border-radius: 5px;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            background-color: #fafafa;
            min-height: 0;
            height: 100%;
        }

        /* 普通 textarea 样式 */
        .layui-textarea {
            resize: none;
            border: 1px solid #e6e6e6;
            border-radius: 5px;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            background-color: #fafafa;
        }

        /* 分屏模式标题 */
        .split-title {
            flex-shrink: 0;
            padding: 10px 20px 0;
            background-color: transparent;
        }

        .split-title .layui-elem-field {
            margin-bottom: 0;
        }

        body.dark-mode .split-title legend {
            color: #e0e0e0;
        }

        /* ==================== 分屏布局 ==================== */
        .split-view {
            display: flex;
            flex: 1;
            min-height: 0;
            position: relative;

            max-height: calc(100vh - 10px);
            overflow-wrap: break-word;
            overflow: auto;
            overflow-x: auto;
            overflow-y: auto;
        }

        .split-left,
        .split-right {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            flex: 1 1 50%;
        }

        .split-left {
            padding: 0 10px 10px 20px;
        }

        .split-right {
            padding: 0 20px 0 10px;
        }

        /* 可拖动分割线 */
        .split-resizer {
            width: 6px;
            background: #e6e6e6;
            cursor: col-resize;
            transition: background 0.2s;
            position: relative;
            flex-shrink: 0;
        }

        .split-resizer:hover {
            background: #009688;
        }

        .split-resizer::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 30px;
            background: #999;
            border-radius: 1px;
        }

        .split-resizer:hover::before {
            background: #fff;
        }

        /* ==================== 面板头部 ==================== */
        .panel-header {
            font-weight: bold;
            margin-bottom: 10px;
            padding: 8px 12px;
            background-color: #f2f2f2;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header i {
            font-size: 16px;
        }

        /* ==================== 树形视图 ==================== */
        #tree-view {
            flex: 1;
            overflow: auto;
            background-color: #fafafa;
            border: 1px solid #e6e6e6;
            border-radius: 5px;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            max-width: 100%;
            word-break: normal;
            overflow-wrap: anywhere;
            margin-bottom: 10px;
        }

        /* 树形视图基础样式 */
        .tree-node {
            margin-left: 0;
            position: relative;
        }

        .tree-node-root {
            margin-left: 0;
        }

        .tree-children {
            display: block;
            margin-left: 20px;
        }

        .tree-children.collapsed {
            display: none;
        }

        .tree-load-more {
            margin: 6px 0;
            padding: 5px 10px;
            border: 1px solid var(--line, #d8d8d8);
            border-radius: 4px;
            background: var(--panel-muted, transparent);
            color: var(--text-muted, #666);
            font: inherit;
            cursor: pointer;
        }

        .tree-load-more:hover,
        .tree-load-more:focus-visible {
            border-color: var(--accent, #16baaa);
            color: var(--accent, #16baaa);
            outline: none;
        }

        .tree-item {
            padding: 2px 0;
        }

        .tree-line {
            min-width: 0;
            line-height: 1.7;
        }

        .tree-collection-footer {
            padding-left: 20px;
        }

        .tree-toggle-placeholder {
            display: inline-block;
            width: 20px;
        }

        .tree-comma {
            color: inherit;
            white-space: nowrap;
        }

        .image-preview-source {
            cursor: zoom-in;
            text-decoration: underline dotted;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        .image-preview-popover {
            position: fixed;
            z-index: 10000;
            display: none;
            width: min(380px, calc(100vw - 24px));
            padding: 9px;
            overflow: hidden;
            border: 1px solid var(--line-strong, #bdc5ba);
            border-radius: 10px;
            background: var(--panel-bg, #fffefa);
            box-shadow: 0 18px 48px rgba(20, 32, 25, 0.24);
            pointer-events: none;
        }

        .image-preview-popover.visible {
            display: block;
            animation: image-preview-in 120ms ease-out;
        }

        .image-preview-canvas {
            display: flex;
            min-height: 100px;
            max-height: min(320px, calc(100vh - 100px));
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 6px;
            background-color: #edf0eb;
            background-image:
                linear-gradient(45deg, #d8ddd6 25%, transparent 25%),
                linear-gradient(-45deg, #d8ddd6 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #d8ddd6 75%),
                linear-gradient(-45deg, transparent 75%, #d8ddd6 75%);
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            background-size: 16px 16px;
        }

        .image-preview-canvas img {
            display: block;
            max-width: 100%;
            max-height: min(300px, calc(100vh - 120px));
            object-fit: contain;
        }

        .image-preview-meta {
            padding: 7px 2px 0;
            color: var(--text-muted, #66726b);
            font-family: var(--code-font, monospace);
            font-size: 11px;
        }

        @keyframes image-preview-in {
            from {
                opacity: 0;
                transform: translateY(3px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .tree-bracket {
            color: #333;
        }

        .tree-ellipsis {
            color: #999;
            font-style: italic;
            margin-left: 4px;
        }

        /* 树形视图切换按钮 */
        .tree-toggle {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-right: 4px;
            font-size: 10px;
            color: #666;
            user-select: none;
        }

        .tree-toggle:hover {
            color: #333;
        }

        /* 树形视图键值样式 */
        .tree-key {
            color: #881391;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        .tree-key:hover {
            background-color: #e8e8e8;
        }

        .tree-key::after {
            content: ': ';
            color: #333;
        }

        /* 树形视图数据类型样式 */
        .tree-string {
            color: #0d7377;
        }

        .tree-number {
            color: #1a73e8;
        }

        .tree-boolean {
            color: #e65100;
        }

        .tree-null {
            color: #757575;
            font-style: italic;
        }

        /* 树形视图值样式 */
        .tree-value {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: background-color 0.2s;
            display: inline;
            word-break: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .tree-value:hover {
            background-color: #e3f2fd;
        }

        /* ==================== 工具栏 ==================== */
        .toolbar-row {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .settings-row {
            padding: 10px;
            background-color: #f8f8f8;
            border-radius: 4px;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-group label {
            font-weight: bold;
            white-space: nowrap;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            margin-left: 10px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background-color: #e0e0e0;
        }

        .split-btn {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            padding: 0;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background-color: #fff;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 12px;
        }

        .split-btn:hover {
            background-color: #f5f5f5;
            border-color: #1890ff;
            color: #1890ff;
        }

        .split-btn:active {
            background-color: #e6f7ff;
        }

        .split-btn.active {
            background-color: #1890ff;
            border-color: #1890ff;
            color: #fff;
        }

        .split-btn.active:hover {
            background-color: #40a9ff;
            border-color: #40a9ff;
            color: #fff;
        }

        /* ==================== 版本号 ==================== */
        .version-display {
            position: fixed;
            bottom: 5px;
            right: 10px;
            font-size: 12px;
            color: #666;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 2px 8px;
            border-radius: 3px;
            z-index: 1000;
        }

        /* ==================== 验证结果 ==================== */
        #valid-result {
            margin-top: 10px;
            font-weight: bold;
        }

        .es-pass {
            color: green;
        }

        .es-fail {
            color: red;
        }

        .es-empty {
            display: none;
        }

        /* ==================== 夜间模式 ==================== */
        body.dark-mode {
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        /* 夜间模式 - 基础组件 */
        body.dark-mode .container {
            background-color: #1a1a1a;
        }

        body.dark-mode .layui-form-label,
        body.dark-mode .panel-header,
        body.dark-mode .theme-toggle {
            color: #e0e0e0;
        }

        body.dark-mode .settings-row,
        body.dark-mode .panel-header,
        body.dark-mode .version-display {
            background-color: #2d2d2d;
        }

        body.dark-mode .theme-toggle {
            background-color: #3d3d3d;
            border-color: #555;
        }

        body.dark-mode .theme-toggle:hover {
            background-color: #4d4d4d;
        }

        body.dark-mode .version-display {
            color: #999;
        }

        /* 夜间模式 - 编辑器/树形视图/JSON显示区 */
        body.dark-mode #tree-view,
        body.dark-mode .editor-container textarea,
        body.dark-mode .layui-textarea,
        body.dark-mode #json-display {
            background-color: #2d2d2d;
            border-color: #444;
            color: #e0e0e0;
        }

        /* 夜间模式 - JSON 显示区颜色 */
        body.dark-mode .json-key {
            color: #d4a5d4;
        }

        body.dark-mode .json-string {
            color: #7fdbca;
        }

        body.dark-mode .json-number {
            color: #82b1ff;
        }

        body.dark-mode .json-boolean {
            color: #ffab91;
        }

        body.dark-mode .json-null {
            color: #b0b0b0;
        }

        /* 夜间模式 - 树形视图 */
        body.dark-mode .tree-key {
            color: #d4a5d4;
        }

        body.dark-mode .tree-key:hover {
            background-color: #3d3d3d;
        }

        body.dark-mode .tree-string {
            color: #7fdbca;
        }

        body.dark-mode .tree-number {
            color: #82b1ff;
        }

        body.dark-mode .tree-boolean {
            color: #ffab91;
        }

        body.dark-mode .tree-null {
            color: #b0b0b0;
        }

        body.dark-mode .tree-toggle {
            color: #999;
        }

        body.dark-mode .tree-toggle:hover {
            color: #ccc;
        }

        body.dark-mode .tree-value:hover {
            background-color: #1e3a5f;
        }

        /* 夜间模式 - LaTeX */
        body.dark-mode .latex-inline .katex,
        body.dark-mode .latex-block .katex {
            color: #7fdbca;
        }

        /* 夜间模式 - 分屏按钮 */
        body.dark-mode .split-btn {
            background-color: #2d2d2d;
            border-color: #444;
            color: #999;
        }

        body.dark-mode .split-btn:hover {
            background-color: #3d3d3d;
            border-color: #1890ff;
            color: #1890ff;
        }

        body.dark-mode .split-btn:active {
            background-color: #1890ff22;
        }

        /* ==================== 搜索功能 ==================== */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            background-color: #f8f8f8;
            border: 1px solid #e6e6e6;
            border-radius: 4px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .search-bar.hidden {
            display: none;
        }

        .search-bar input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 12px;
            outline: none;
            min-width: 0;
            transition: border-color 0.2s;
        }

        .search-bar input:focus {
            border-color: #1890ff;
        }

        .search-bar input.regex-error {
            border-color: #ff4d4f;
            background-color: #fff2f0;
        }

        .search-bar .search-btn {
            width: 24px;
            height: 24px;
            padding: 0;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            border-radius: 3px;
            font-size: 12px;
            transition: all 0.15s;
        }

        .search-bar .search-btn:hover {
            background-color: #e8e8e8;
            color: #1890ff;
        }

        .search-bar .search-btn.active {
            background-color: #e6f7ff;
            border-color: #1890ff;
            color: #1890ff;
        }

        .search-bar .search-separator {
            width: 1px;
            height: 16px;
            background-color: #ddd;
            margin: 0 2px;
        }

        .search-bar .search-count {
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            min-width: 40px;
            text-align: center;
        }

        .search-highlight {
            background-color: #fff3cd;
            border-radius: 2px;
            padding: 0 1px;
        }

        .search-highlight-active {
            background-color: #ff9632;
            color: #fff;
            border-radius: 2px;
            padding: 0 1px;
        }

        body.dark-mode .search-bar {
            background-color: #2d2d2d;
            border-color: #444;
        }

        body.dark-mode .search-bar input {
            background-color: #3d3d3d;
            border-color: #555;
            color: #e0e0e0;
        }

        body.dark-mode .search-bar input:focus {
            border-color: #1890ff;
        }

        body.dark-mode .search-bar input.regex-error {
            border-color: #ff4d4f;
            background-color: #3d2020;
        }

        body.dark-mode .search-bar .search-btn {
            color: #999;
        }

        body.dark-mode .search-bar .search-btn:hover {
            background-color: #3d3d3d;
            color: #1890ff;
        }

        body.dark-mode .search-bar .search-btn.active {
            background-color: #112a45;
            border-color: #1890ff;
            color: #1890ff;
        }

        body.dark-mode .search-bar .search-separator {
            background-color: #444;
        }

        body.dark-mode .search-highlight {
            background-color: #5a4e00;
            color: #ffd;
        }

        body.dark-mode .search-highlight-active {
            background-color: #d97706;
            color: #fff;
        }

        /* ==================== 自定义通知 ==================== */
        .custom-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            z-index: 999999;
            font-size: 14px;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s;
        }

        .custom-toast.fade-out {
            opacity: 0;
        }

        /* ==================== 工作台视觉层 ==================== */
        :root {
            --app-bg: #f4f5f2;
            --panel-bg: #fffefa;
            --panel-muted: #f0f2ed;
            --line: #d9ddd5;
            --line-strong: #bdc5ba;
            --text: #17201c;
            --text-muted: #66726b;
            --accent: #0b7a75;
            --accent-soft: #dcefeb;
            --danger: #bb3e36;
            --danger-soft: #f8e4e0;
            --code-font: 'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace;
        }

        body {
            background:
                radial-gradient(circle at 12% 12%, rgba(11, 122, 117, 0.08), transparent 28%),
                var(--app-bg);
            color: var(--text);
            font-family: 'Avenir Next', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .split-title {
            height: 58px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 254, 250, 0.92);
        }

        .split-title .layui-elem-field {
            width: 100%;
            margin: 0;
            border: 0;
        }

        .split-title legend {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin: 0;
            padding: 0;
            color: var(--text);
        }

        .split-title legend span {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .split-title legend small {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .split-view {
            max-height: none;
            overflow: hidden;
            gap: 0;
            padding: 14px 16px 8px;
        }

        .split-left,
        .split-right {
            padding: 0;
            background: var(--panel-bg);
            border: 1px solid var(--line);
            min-height: 0;
        }

        .split-left {
            border-radius: 10px 0 0 10px;
        }

        .split-right {
            border-radius: 0 10px 10px 0;
        }

        .panel-header {
            min-height: 48px;
            margin: 0;
            padding: 8px 10px 8px 16px;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            background: var(--panel-muted);
        }

        .panel-title {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .panel-title i {
            color: var(--accent);
        }

        .editor-container,
        #tree-view {
            min-height: 0;
        }

        .editor-container textarea,
        #tree-view {
            margin: 0;
            border: 0;
            border-radius: 0;
            background: var(--panel-bg);
            color: var(--text);
            font-family: var(--code-font);
            font-size: 13px;
            line-height: 1.7;
        }

        #tree-view {
            padding: 16px 18px 22px;
            margin-bottom: 0;
        }

        #tree-view:empty::before {
            content: '输入有效 JSON 后，数据结构将在这里展开';
            display: block;
            max-width: 260px;
            margin: 64px auto;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.8;
        }

        .tree-error-state {
            padding: 36px 18px;
            color: var(--danger);
            text-align: center;
        }

        .json-render-limit {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            margin: 20px;
            padding: 18px 20px;
            color: #5b4b28;
            background: #fff8e6;
            border: 1px solid #ead9a9;
            border-radius: 10px;
        }

        .json-render-limit-action {
            padding: 7px 13px;
            color: #fff;
            background: #237a57;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        body.dark-mode .json-render-limit {
            color: #eadcb7;
            background: #302b20;
            border-color: #665a3c;
        }

        .split-resizer {
            width: 8px;
            background: var(--app-bg);
        }

        .split-resizer::before {
            width: 2px;
            height: 42px;
            background: var(--line-strong);
        }

        .split-resizer:hover {
            background: var(--accent-soft);
        }

        .split-btn,
        body.dark-mode .split-btn {
            width: 30px;
            height: 30px;
            border-color: transparent;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
        }

        .split-btn:hover,
        body.dark-mode .split-btn:hover {
            border-color: var(--line);
            background: var(--panel-bg);
            color: var(--accent);
        }

        .split-btn.active,
        body.dark-mode .split-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: white;
        }

        .tree-item {
            padding: 3px 0;
        }

        .tree-key {
            color: #7650a0;
        }

        .tree-string {
            color: #08795e;
        }

        .tree-number {
            color: #c05a23;
        }

        .tree-boolean {
            color: #1769aa;
        }

        .tree-toggle:hover,
        .tree-key:hover,
        .tree-value:hover {
            background: var(--accent-soft);
        }

        body.dark-mode {
            --app-bg: #111713;
            --panel-bg: #18201b;
            --panel-muted: #202a24;
            --line: #344039;
            --line-strong: #536158;
            --text: #e8eee9;
            --text-muted: #9eaca3;
            --accent: #64c7bd;
            --accent-soft: #233f3a;
            --danger: #ff8b80;
            --danger-soft: #3b2522;
            background: var(--app-bg);
        }

        body.dark-mode .split-title,
        body.dark-mode #tree-view,
        body.dark-mode .split-left,
        body.dark-mode .split-right {
            background-color: var(--panel-bg);
            color: var(--text);
            border-color: var(--line);
        }

        body.dark-mode .panel-header {
            background: var(--panel-muted);
            border-color: var(--line);
        }

        body.dark-mode .tree-key {
            color: #d7a9ef;
        }

        body.dark-mode .tree-string {
            color: #7fdbb9;
        }

        body.dark-mode .tree-bracket,
        body.dark-mode .tree-comma,
        body.dark-mode .tree-key::after {
            color: var(--text);
        }

        body.dark-mode .image-preview-canvas {
            background-color: #222b25;
            background-image:
                linear-gradient(45deg, #354039 25%, transparent 25%),
                linear-gradient(-45deg, #354039 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #354039 75%),
                linear-gradient(-45deg, transparent 75%, #354039 75%);
        }

        .html-inline-preview {
            display: block;
            width: 100%;
            min-height: 180px;
            border: 0;
            border-radius: 0 0 8px 8px;
            background: #fff;
        }

        .html-preview-card {
            display: inline-flex;
            width: min(580px, calc(100vw - 120px));
            max-width: 100%;
            margin: 4px 0;
            overflow: hidden;
            flex-direction: column;
            vertical-align: top;
            border: 1px solid var(--line-strong);
            border-radius: 9px;
            background: var(--panel-bg);
            color: var(--text);
            box-shadow: 0 8px 24px rgba(28, 44, 34, 0.1);
            white-space: normal;
        }

        .html-preview-header {
            display: flex;
            min-height: 34px;
            padding: 4px 6px 4px 10px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid var(--line);
            background: var(--panel-muted);
        }

        .html-preview-label {
            color: var(--text-muted);
            font-family: var(--code-font);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        .html-preview-actions {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .html-preview-tab,
        .html-preview-copy {
            min-height: 24px;
            padding: 2px 8px;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: var(--text-muted);
            font: 11px/1.2 var(--code-font);
            cursor: pointer;
        }

        .html-preview-tab:hover,
        .html-preview-copy:hover {
            background: var(--panel-bg);
            color: var(--accent);
        }

        .html-preview-tab.active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 800;
        }

        .html-preview-copy {
            margin-left: 3px;
            border-left: 1px solid var(--line);
            border-radius: 0 5px 5px 0;
        }

        .html-preview-content {
            display: block;
            min-width: 0;
            background: #fffefa;
        }

        .html-preview-source {
            display: block;
            min-height: 180px;
            max-height: 320px;
            margin: 0;
            padding: 16px 18px;
            overflow: auto;
            background: #18201b;
            color: #bce8d3;
            font: 12px/1.65 var(--code-font);
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            tab-size: 2;
        }

        .inline-image-preview {
            display: inline-block;
            max-width: min(420px, 60vw);
            max-height: 280px;
            object-fit: contain;
            vertical-align: top;
            border-radius: 7px;
            background: #fff;
        }

        @media (max-width: 760px) {
            .split-title {
                height: 50px;
                padding: 0 12px;
            }

            .split-title legend small {
                display: none;
            }

            .split-view {
                flex-direction: column;
                overflow: auto;
                padding: 8px;
            }

            .split-left,
            .split-right {
                flex: 0 0 auto !important;
                min-height: 46vh;
                border-radius: 8px;
            }

            .split-resizer {
                display: none;
            }

            .split-right {
                margin-top: 8px;
            }
        }

        /* ==================== 统一工作台 ==================== */
        .workbench-shell {
            width: 100%;
            height: 100%;
            max-height: none;
            padding: 0;
            overflow: hidden;
        }

        .workbench-titlebar {
            flex: 0 0 58px;
            justify-content: space-between;
        }

        .workbench-titlebar .version-display {
            position: static;
            flex: 0 0 auto;
            padding: 0;
            color: var(--text-muted);
            font-family: var(--code-font);
            font-size: 11px;
        }

        .workbench-form {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
        }

        .workbench-toolbar {
            flex: 0 0 auto;
            padding: 10px 16px 8px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 254, 250, 0.82);
        }

        .workbench-toolbar .toolbar-row {
            display: flex;
            width: 100%;
            margin: 0;
            align-items: center;
            gap: 10px;
        }

        .workbench-primary-row {
            justify-content: space-between;
        }

        .toolbar-cluster {
            display: inline-flex;
            min-width: 0;
            align-items: center;
            gap: 4px;
        }

        .toolbar-label {
            margin-right: 3px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .toolbar-button,
        .result-view-btn {
            display: inline-flex;
            height: 32px;
            padding: 0 10px;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--panel-bg);
            color: var(--text);
            font: inherit;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .toolbar-button:hover,
        .result-view-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .toolbar-button.primary,
        .toolbar-button.active,
        .result-view-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .toolbar-button.danger:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .workbench-toolbar .settings-row {
            margin-top: 8px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .workbench-toolbar .setting-group {
            display: flex;
            margin: 0;
            align-items: center;
            gap: 8px;
        }

        .workbench-toolbar .setting-group > label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
        }

        .copy-format-setting .layui-input-inline {
            width: 175px;
            margin: 0;
        }

        .custom-format-row {
            display: flex;
            margin-top: 8px;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .custom-format-row .layui-input {
            width: 150px;
            height: 30px;
        }

        .workbench-content {
            flex: 1;
            min-height: 0;
            max-height: none;
            padding: 12px 16px 14px;
            overflow: hidden;
        }

        .workbench-panel {
            min-height: 0;
        }

        .workbench-panel .panel-header {
            flex: 0 0 auto;
            min-height: 46px;
            justify-content: space-between;
        }

        .panel-hint {
            color: var(--text-muted);
            font-family: var(--code-font);
            font-size: 10px;
        }

        .editor-container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        #sourceText {
            width: 100%;
            height: 100%;
            min-height: 0;
            padding: 18px 20px;
            resize: none;
            border: 0;
            border-radius: 0;
            outline: none;
            background: var(--panel-bg);
            color: var(--text);
            font-family: var(--code-font);
            font-size: 13px;
            line-height: 1.7;
        }

        #sourceText:focus {
            box-shadow: inset 3px 0 0 var(--accent);
        }

        .result-header {
            gap: 10px;
        }

        .result-view-tabs,
        .result-tools {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .result-view-btn {
            height: 30px;
            border-color: transparent;
            background: transparent;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        #valid-result {
            display: flex !important;
            flex: 0 0 auto;
            min-height: 31px;
            margin: 0;
            padding: 6px 16px;
            align-items: center;
            gap: 7px;
            overflow: auto;
            border-bottom: 1px solid var(--line);
            background: var(--panel-bg);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            white-space: pre-wrap;
        }

        #valid-result::before {
            content: '';
            width: 7px;
            height: 7px;
            flex: 0 0 7px;
            border-radius: 50%;
            background: #a7afa9;
        }

        #valid-result.es-pass {
            color: var(--accent);
        }

        #valid-result.es-pass::before {
            background: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        #valid-result.es-fail {
            color: var(--danger);
            background: var(--danger-soft);
        }

        #valid-result.es-fail::before {
            background: var(--danger);
        }

        .result-workspace,
        .result-view-panel {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            overflow: hidden;
        }

        #tree-view,
        #json-display {
            flex: 1;
            min-height: 0;
            margin: 0;
            overflow: auto;
        }

        #highlight-result #json-display {
            padding: 16px 18px 22px;
            border: 0;
            border-radius: 0;
            background-color: #1a1a1a;
            color: #e0e0e0;
            color-scheme: dark;
        }

        #highlight-result #json-display .json-key { color: #d4a5d4; }
        #highlight-result #json-display .json-string { color: #7fdbca; }
        #highlight-result #json-display .json-number { color: #82b1ff; }
        #highlight-result #json-display .json-boolean { color: #ffab91; }
        #highlight-result #json-display .json-null { color: #b0b0b0; }

        #workbenchShell[data-layout="editor"] #splitRightPanel,
        #workbenchShell[data-layout="editor"] #splitResizer,
        #workbenchShell[data-layout="result"] #splitLeftPanel,
        #workbenchShell[data-layout="result"] #splitResizer {
            display: none;
        }

        #workbenchShell[data-layout="editor"] #splitLeftPanel,
        #workbenchShell[data-layout="result"] #splitRightPanel {
            flex: 1 1 100% !important;
            border-radius: 10px;
        }

        body.dark-mode .workbench-toolbar,
        body.dark-mode #valid-result,
        body.dark-mode #sourceText {
            border-color: var(--line);
            background-color: var(--panel-bg);
            color: var(--text);
        }

        body.dark-mode .toolbar-button,
        body.dark-mode .result-view-btn {
            border-color: var(--line);
            background: var(--panel-muted);
            color: var(--text);
        }

        body.dark-mode .toolbar-button.active,
        body.dark-mode .toolbar-button.primary,
        body.dark-mode .result-view-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #10241f;
        }

        @media (max-width: 1050px) {
            .toolbar-button span,
            .window-actions .toolbar-button span {
                display: none;
            }

            .toolbar-button {
                width: 32px;
                padding: 0;
            }

            .layout-mode-group .toolbar-button {
                width: auto;
                padding: 0 9px;
            }

            .layout-mode-group .toolbar-button span {
                display: inline;
            }
        }

        @media (max-width: 760px) {
            .workbench-titlebar {
                height: 50px;
                flex-basis: 50px;
            }

            .workbench-titlebar .version-display,
            .toolbar-label,
            .layout-mode-btn[data-layout="split"] {
                display: none;
            }

            .workbench-toolbar {
                padding: 8px;
            }

            .workbench-primary-row {
                gap: 6px;
            }

            .window-actions {
                margin-left: auto;
            }

            .workbench-toolbar .settings-row {
                flex-wrap: wrap;
                overflow: visible;
            }

            .workbench-content {
                flex-direction: row;
                padding: 8px;
                overflow: hidden;
            }

            .workbench-content .split-left,
            .workbench-content .split-right {
                flex: 1 1 100% !important;
                min-height: 0;
                margin: 0;
                border-radius: 8px;
            }

            #workbenchShell[data-layout="split"] #splitRightPanel,
            #workbenchShell[data-layout="split"] #splitResizer {
                display: none;
            }

            .panel-hint {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main class="container workbench-shell no-drag" id="workbenchShell" data-layout="split">
        <header class="drag-region split-title workbench-titlebar">
            <fieldset class="layui-elem-field layui-field-title">
                <legend><span>JSON FORMATTER</span><small>验证、格式化并浏览复杂数据</small></legend>
            </fieldset>
            <div class="version-display no-drag" id="mainVersion">版本: <span id="version">--</span></div>
        </header>

        <div class="layui-form no-drag workbench-form">
            <section id="main-toolbar" class="workbench-toolbar no-drag" aria-label="工作台工具栏">
                <div class="toolbar-row workbench-primary-row">
                    <div class="toolbar-cluster" aria-label="JSON 操作">
                        <button id="pasteBtn" class="toolbar-button" title="从剪贴板读取"><i
                                class="layui-icon layui-icon-read"></i><span>粘贴</span></button>
                        <button id="formatBtn" class="toolbar-button primary"><i
                                class="layui-icon layui-icon-release"></i><span>格式化</span></button>
                        <button id="clearBtn" class="toolbar-button" title="清空"><i
                                class="layui-icon layui-icon-delete"></i><span>清空</span></button>
                    </div>

                    <div class="toolbar-cluster layout-mode-group" aria-label="布局">
                        <span class="toolbar-label">布局</span>
                        <button class="toolbar-button layout-mode-btn" data-layout="editor" title="仅显示编辑器"><i
                                class="layui-icon layui-icon-form"></i><span>编辑</span></button>
                        <button class="toolbar-button layout-mode-btn active" data-layout="split" title="同时显示编辑器和结果"><i
                                class="layui-icon layui-icon-senior"></i><span>双栏</span></button>
                        <button class="toolbar-button layout-mode-btn" data-layout="result" title="仅显示结果"><i
                                class="layui-icon layui-icon-template-1"></i><span>结果</span></button>
                    </div>

                    <div class="toolbar-cluster window-actions" aria-label="应用与窗口操作">
                        <button id="checkUpdate" class="toolbar-button" title="检查更新"><i
                                class="layui-icon layui-icon-radio"></i><span>更新</span></button>
                        <button id="themeToggle" class="toolbar-button theme-toggle" title="切换主题"><i
                                class="layui-icon layui-icon-moon"></i><span>夜间</span></button>
                        <button id="minimize" class="toolbar-button" title="最小化"><i
                                class="layui-icon layui-icon-eye-invisible"></i><span>最小化</span></button>
                        <button id="maximizeBtn" class="toolbar-button" title="最大化"><i
                                class="layui-icon layui-icon-screen-full"></i><span>最大化</span></button>
                        <button id="close" class="toolbar-button danger" title="关闭"><i
                                class="layui-icon layui-icon-close"></i><span>关闭</span></button>
                    </div>
                </div>

                <div class="toolbar-row settings-row">
                    <div class="setting-group workbench-options">
                        <label>选项</label>
                        <input type="checkbox" lay-filter="explain" id="explain" title="转义" class="no-drag">
                        <span title="仅解析最外层 JSON 字符串一次">
                            <input type="checkbox" lay-filter="parseJsonString" id="parseJsonString"
                                title="解析字符串类型json" class="no-drag">
                        </span>
                        <span title="在严格沙箱中预览图片和表格，不执行脚本">
                            <input type="checkbox" lay-filter="renderHtml" id="renderHtml" title="富内容" class="no-drag">
                        </span>
                        <input type="checkbox" lay-filter="topCheck" id="topCheck" title="置顶" class="no-drag">
                        <input type="checkbox" lay-filter="autoStart" id="autoStart" title="开机自启" class="no-drag">
                        <input type="checkbox" lay-filter="disableUpdate" id="disableUpdate" title="禁用更新"
                            class="no-drag">
                    </div>

                    <div class="setting-group copy-format-setting">
                        <label for="copyFormat">复制格式</label>
                        <div class="layui-input-inline">
                            <select name="copyFormat" id="copyFormat" lay-filter="copyFormat">
                                <option value="default">默认 ["key"]</option>
                                <option value="dot">点号 .key</option>
                                <option value="jsonpath">JSONPath $.key</option>
                                <option value="bracket">方括号 ['key']</option>
                                <option value="python">Python .get</option>
                                <option value="custom">自定义</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="customFormatContainer" class="custom-format-row hidden">
                    <label for="customKeyFormat">自定义格式</label>
                    <span>键</span>
                    <input type="text" id="customKeyFormat" value=".{key}" placeholder="如: .{key}" class="layui-input">
                    <span>索引</span>
                    <input type="text" id="customIndexFormat" value="[{index}]" placeholder="如: [{index}]"
                        class="layui-input">
                </div>
            </section>

            <section class="split-view workbench-content" id="splitViewContainer">
                <section class="split-left workbench-panel" id="splitLeftPanel" aria-label="JSON 编辑器">
                    <div class="panel-header">
                        <span class="panel-title"><i class="layui-icon layui-icon-form"></i> JSON 编辑器</span>
                        <span class="panel-hint">唯一输入源</span>
                    </div>
                    <div class="editor-container">
                        <textarea id="sourceText" placeholder="请输入JSON字符串" class="layui-textarea"
                            spellcheck="false"></textarea>
                    </div>
                </section>

                <div class="split-resizer" id="splitResizer" role="separator" aria-orientation="vertical"
                    aria-label="调整编辑器和结果面板宽度"></div>

                <section class="split-right workbench-panel" id="splitRightPanel" aria-label="JSON 结果">
                    <div class="panel-header result-header">
                        <div class="result-view-tabs" role="tablist" aria-label="结果视图">
                            <button id="treeViewBtn" class="result-view-btn active" data-result-view="tree" role="tab"
                                aria-selected="true"><i class="layui-icon layui-icon-tree"></i> 树形</button>
                            <button id="highlightViewBtn" class="result-view-btn" data-result-view="highlight" role="tab"
                                aria-selected="false"><i class="layui-icon layui-icon-code-circle"></i> 高亮</button>
                        </div>
                        <div class="result-tools" data-result-tools="tree">
                            <button class="split-btn" id="treeSearchToggle" title="搜索树形结果"><i
                                    class="layui-icon layui-icon-search"></i></button>
                            <button class="split-btn" id="splitExpandAll" title="展开已加载节点"><i
                                    class="layui-icon layui-icon-spread-left"></i></button>
                            <button class="split-btn" id="splitCollapseAll" title="折叠全部"><i
                                    class="layui-icon layui-icon-shrink-right"></i></button>
                        </div>
                        <div class="result-tools hidden" data-result-tools="highlight">
                            <button class="split-btn" id="editorSearchToggle" title="搜索高亮结果"><i
                                    class="layui-icon layui-icon-search"></i></button>
                        </div>
                    </div>

                    <div id="valid-result" class="status-empty" aria-live="polite">等待输入 JSON</div>
                    <div id="resultWorkspace" class="result-workspace" data-result-view="tree">
                        <div id="tree-result" class="result-view-panel" role="tabpanel" aria-labelledby="treeViewBtn">
                            <div class="search-bar hidden" id="treeSearchBar">
                                <input type="text" id="treeSearchInput" placeholder="搜索 key 或 value..." />
                                <button class="search-btn" id="treeCaseSensitive" title="大小写敏感 (Alt+C)">Aa</button>
                                <button class="search-btn" id="treeUseRegex" title="正则表达式 (Alt+R)">.*</button>
                                <div class="search-separator"></div>
                                <span class="search-count" id="treeSearchCount"></span>
                                <button class="search-btn" id="treeSearchPrev" title="上一个 (Shift+Enter)"><i
                                        class="layui-icon layui-icon-up"></i></button>
                                <button class="search-btn" id="treeSearchNext" title="下一个 (Enter)"><i
                                        class="layui-icon layui-icon-down"></i></button>
                                <button class="search-btn" id="treeSearchClear" title="关闭 (Esc)"><i
                                        class="layui-icon layui-icon-close"></i></button>
                            </div>
                            <div id="tree-view"></div>
                        </div>

                        <div id="highlight-result" class="result-view-panel hidden" role="tabpanel"
                            aria-labelledby="highlightViewBtn">
                            <div class="search-bar hidden" id="editorSearchBar">
                                <input type="text" id="editorSearchInput" placeholder="搜索 key 或 value..." />
                                <button class="search-btn" id="editorCaseSensitive" title="大小写敏感 (Alt+C)">Aa</button>
                                <button class="search-btn" id="editorUseRegex" title="正则表达式 (Alt+R)">.*</button>
                                <div class="search-separator"></div>
                                <span class="search-count" id="editorSearchCount"></span>
                                <button class="search-btn" id="editorSearchPrev" title="上一个 (Shift+Enter)"><i
                                        class="layui-icon layui-icon-up"></i></button>
                                <button class="search-btn" id="editorSearchNext" title="下一个 (Enter)"><i
                                        class="layui-icon layui-icon-down"></i></button>
                                <button class="search-btn" id="editorSearchClear" title="关闭 (Esc)"><i
                                        class="layui-icon layui-icon-close"></i></button>
                            </div>
                            <div id="json-display"></div>
                        </div>
                    </div>
                </section>
            </section>
        </div>
    </main>
    <script type="module" src="./main.ts"></script>
</body>

</html>
